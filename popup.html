<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avala Work Alert Pro</title><link rel="stylesheet" href="ui.css"></head><body class="popup">
<header><img src="icons/icon48.png" alt=""><div><h1>AVALA WORK ALERT <span class="muted">PRO</span></h1><small id="connection">Connecting…</small></div></header>
<section class="status" id="status" aria-live="polite"><h2>Current status</h2><strong id="statusTitle">Connecting…</strong><p id="statusDetail">Reading saved state</p></section>
<div class="metrics row"><span>Today <strong id="detections">0</strong> new</span><span><strong id="notifications">0</strong> alerts</span></div>
<section class="batches" id="batches" aria-label="Currently available batches"></section>
<div class="metrics"><div class="row"><span>Last scan</span><strong id="lastScan">—</strong></div><div class="row"><span>Last alert</span><strong id="lastAlert">—</strong></div></div>
<div class="row"><button class="primary" id="open">Open Avala ↗</button><button id="scan">Scan now</button></div><p id="feedback" role="status"></p>
<details><summary>Recent alerts</summary><div id="history"></div></details><details id="debugPanel" hidden><summary>Detector diagnostics</summary><pre id="debug"></pre></details>
<button id="stop">Stop alert</button><footer><button id="ack">Mark seen</button><button id="options">Settings ⚙</button></footer><script type="module" src="popup.js"></script></body></html>
